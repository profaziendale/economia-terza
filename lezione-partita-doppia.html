<meta charset="utf-8">
<title>Partita doppia a colori</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: lettore video scuro attorno a un palco 1920×1080 color carta; codice colore VF+ verde / VF− rosso; economici: d’esercizio blu, pluriennali viola, patrimonio netto petrolio, sospesi arancio */
:root{
  --paper:#F6F3EC; --ink:#1B1F2A; --line:#D9D4C7; --mute:#5A6070; --card:#FFFFFF;
  --blu:#0B3BFF;  --blu-t:#0A2FD0; --blu-bg:#E4EAFF;
  --vio:#7A3FD1;  --vio-t:#5E2BAE; --vio-bg:#EFE6FC;
  --tea:#00838F;  --tea-t:#006A74; --tea-bg:#DDF2F3;
  --ora:#E06A00;  --ora-t:#A84F00; --ora-bg:#FDEBD8;
  --ver:#00A13E;  --ver-t:#007A2F; --ver-bg:#DDF5E5;
  --ros:#F01E16;  --ros-t:#C8150E; --ros-bg:#FDE3E1;
  --gold:#FFF1B8;
  --chrome:#10131B; --chrome-2:#1B2030; --chrome-fg:#EEEBE3; --chrome-mute:#9AA2B4;
  --f-disp:'Bricolage Grotesque','IBM Plex Sans',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--chrome);color:var(--chrome-fg);font-family:var(--f-body);margin:0}
.page{min-height:100%;box-sizing:border-box;padding-block:16px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;gap:12px}
.player{width:100%;max-width:calc((100vh - 170px) * 16 / 9);min-width:0;display:flex;flex-direction:column;gap:10px}
.viewport{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:#000;border-radius:10px;overflow:hidden}
.player:fullscreen{max-width:none;background:#000;justify-content:center;padding:0}
.player:fullscreen .viewport{border-radius:0;aspect-ratio:auto;flex:1}
.player:fullscreen .controls{position:absolute;left:0;right:0;bottom:0;padding:10px 16px;background:rgba(16,19,27,.92);opacity:0;transition:opacity .25s}
.player:fullscreen:hover .controls{opacity:1}
.player.rec .controls{display:none}

/* ---------- PALCO ---------- */
.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--paper);color:var(--ink);font-family:var(--f-body);overflow:hidden;font-variant-numeric:tabular-nums}
.scene{position:absolute;inset:0;will-change:transform,opacity}
.scene.lesson{background:var(--paper)}
.shead{position:absolute;left:64px;right:64px;top:92px;display:flex;align-items:center;gap:20px}
.kchip{font-family:var(--f-mono);font-size:19px;font-weight:600;letter-spacing:.08em;color:#fff;background:var(--ink);border-radius:8px;padding:8px 14px;white-space:nowrap}
.shead h2{margin:0;font-family:var(--f-disp);font-weight:800;font-size:44px;letter-spacing:-.015em;line-height:1.02;text-wrap:balance;flex:1}
.snum{font-family:var(--f-mono);font-size:18px;font-weight:600;color:var(--mute)}
.scontent{position:absolute;left:64px;right:64px;top:182px;bottom:128px;display:flex;flex-direction:column;justify-content:center;gap:20px}
.zone{display:flex;flex-direction:column;gap:20px}
.grid{display:grid;grid-template-columns:700px 1fr;gap:48px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}

/* barra in alto */
.topbar{position:absolute;left:64px;right:64px;top:28px;height:44px;display:flex;align-items:center;gap:40px;z-index:5;transition:opacity .3s}
.segs{display:flex;gap:10px;flex:1}
.seg{flex:1;display:flex;flex-direction:column;gap:6px}
.seg span{font-family:var(--f-mono);font-size:15px;font-weight:600;letter-spacing:.06em;color:var(--mute);white-space:nowrap}
.seg.on span{color:var(--ink)}
.seg i{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.seg i b{display:block;height:100%;width:0;background:var(--ink)}
.legend{display:flex;gap:16px;font-size:16px;font-weight:600;white-space:nowrap}
.legend span{display:flex;align-items:center;gap:8px}
.dot{display:inline-block;width:16px;height:16px;border-radius:50%;flex-shrink:0}
.dot.b{background:var(--blu)}.dot.v{background:var(--vio)}.dot.t{background:var(--tea)}.dot.o{background:var(--ora)}.dot.g{background:var(--ver)}.dot.r{background:var(--ros)}.dot.k{background:var(--ink)}

/* sottotitoli */
.caption{position:absolute;left:64px;right:64px;bottom:22px;min-height:84px;box-sizing:border-box;background:var(--ink);color:#F6F3EC;border-radius:16px;padding:14px 28px;display:flex;align-items:center;gap:20px;font-size:24px;line-height:1.38;z-index:6}
.caption svg{flex-shrink:0;opacity:.7}
.stage.nocap .caption{display:none}

/* colori testo */
b.b,.t-b{color:var(--blu-t)} b.v,.t-v{color:var(--vio-t)} b.t,.t-t{color:var(--tea-t)} b.o,.t-o{color:var(--ora-t)} b.g,.t-g{color:var(--ver-t)} b.r,.t-r{color:var(--ros-t)}

/* ---------- TABELLA PARTITA DOPPIA ---------- */
.tbl{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 20px 12px;display:flex;flex-direction:column}
.tbl-title{display:flex;align-items:center;gap:12px;font-family:var(--f-disp);font-weight:600;font-size:25px;padding:2px 0 10px;line-height:1.2}
.tr{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr) minmax(0,1fr) minmax(0,.95fr) minmax(0,1.45fr);gap:14px;align-items:center}
.th{font-family:var(--f-mono);font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:8px 0;border-bottom:3px solid var(--ink)}
.th .num{text-align:right}
.row{padding:10px 0;border-bottom:1px solid #ECE8DE;font-size:22px}
.acc{font-weight:600;display:flex;align-items:center;gap:12px;line-height:1.15}
.row.b .acc{color:var(--blu-t)}.row.v .acc{color:var(--vio-t)}.row.t .acc{color:var(--tea-t)}.row.o .acc{color:var(--ora-t)}.row.g .acc{color:var(--ver-t)}.row.r .acc{color:var(--ros-t)}
.num{text-align:right}
.amt{display:inline-block;font-family:var(--f-mono);font-weight:600;font-size:22px;padding:4px 10px;border-radius:8px;border:2px solid}
.amt.b{color:var(--blu-t);background:var(--blu-bg);border-color:var(--blu)}
.amt.v{color:var(--vio-t);background:var(--vio-bg);border-color:var(--vio)}
.amt.t{color:var(--tea-t);background:var(--tea-bg);border-color:var(--tea)}
.amt.o{color:var(--ora-t);background:var(--ora-bg);border-color:var(--ora)}
.amt.g{color:var(--ver-t);background:var(--ver-bg);border-color:var(--ver)}
.amt.r{color:var(--ros-t);background:var(--ros-bg);border-color:var(--ros)}
.dest{font-size:17px;color:var(--mute);font-weight:500}
.vchip{display:inline-block;font-family:var(--f-mono);font-size:15px;font-weight:600;padding:4px 8px;border-radius:6px;line-height:1.25}
.vchip.b{background:var(--blu-bg);color:var(--blu-t)}.vchip.v{background:var(--vio-bg);color:var(--vio-t)}.vchip.t{background:var(--tea-bg);color:var(--tea-t)}.vchip.o{background:var(--ora-bg);color:var(--ora-t)}.vchip.g{background:var(--ver-bg);color:var(--ver-t)}.vchip.r{background:var(--ros-bg);color:var(--ros-t)}
.tbl-bal{align-self:flex-end;display:flex;align-items:center;gap:12px;margin-top:10px;font-family:var(--f-mono);font-size:16px;font-weight:600;color:var(--mute)}
.tbl-bal b{color:var(--ink)}
.tbl-bal .ok{display:flex;align-items:center;gap:6px;color:#fff;background:var(--ver);padding:3px 10px 3px 6px;border-radius:20px}
.tbl.wide .row{font-size:24px}.tbl.wide .amt{font-size:24px}.tbl.wide .dest{font-size:18px}.tbl.wide .vchip{font-size:16px}

/* ---------- DOCUMENTO (fattura) ---------- */
.doc{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px 22px;display:flex;flex-direction:column;gap:4px}
.doc-h{display:flex;align-items:center;gap:12px;font-family:var(--f-disp);font-weight:600;font-size:25px;padding-bottom:8px;line-height:1.2}
.drow{display:flex;justify-content:space-between;gap:16px;font-size:21px;padding:6px 10px;margin:0 -10px;border-bottom:1px dashed #CFC9BA;border-radius:6px}
.drow .v{font-family:var(--f-mono);font-weight:500}
.drow.sum{font-weight:600}
.drow.tot{border-bottom:0;border-top:3px solid var(--ink);margin-top:4px;font-size:22px}
.drow.tot .v{font-weight:600}
.doc-foot{font-size:17px;color:var(--mute);padding-top:6px}

/* ---------- PILLOLE ---------- */
.pill{display:flex;align-items:center;gap:18px;border-radius:16px;padding:16px 24px;font-size:23px;line-height:1.38;border:2px solid var(--ink);background:var(--gold);transform-origin:left center}
.pill.info{background:#EAF0FF;border-color:var(--blu)}
.pill.note{background:var(--card);border-color:var(--line)}
.pill .pi{flex-shrink:0;width:52px;height:52px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center}
.pill.note .pi{background:var(--mute)}
.pill.info .pi{background:var(--blu)}

/* ---------- FORMULE ---------- */
.formula{display:flex;align-items:center;justify-content:center;gap:26px}
.fbox{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:16px 30px;min-width:260px}
.fbox .l{font-size:20px;font-weight:500;text-align:center}
.fbox .v{font-family:var(--f-disp);font-weight:800;font-size:58px;line-height:1}
.fbox .s{font-family:var(--f-mono);font-size:17px;color:var(--mute);font-weight:600}
.fbox.res{background:var(--blu-bg);border-color:var(--blu);color:var(--blu-t)}
.fbox.res.v{background:var(--vio-bg);border-color:var(--vio);color:var(--vio-t)}
.fop{font-family:var(--f-disp);font-weight:800;font-size:68px}
.fcomp{display:flex;align-items:center;flex-wrap:wrap;gap:10px;background:var(--card);border:2px dashed var(--ink);border-radius:16px;padding:14px 20px;font-size:22px}
.fcomp .lead{font-weight:600;margin-right:6px}
.tok{font-family:var(--f-mono);font-weight:600;font-size:24px;display:inline-block}
.tok.n{background:#F1EEE6;padding:3px 10px;border-radius:8px}
.tok.res{padding:4px 12px;border-radius:8px;border:2px solid var(--ink);background:var(--gold)}
.tok.res.b{background:var(--blu-bg);border-color:var(--blu);color:var(--blu-t)}
.tok.res.v{background:var(--vio-bg);border-color:var(--vio);color:var(--vio-t)}

/* ---------- PASSI ---------- */
.steps{display:flex;flex-direction:column;gap:12px}
.step{display:flex;align-items:center;gap:16px;font-size:22px;line-height:1.3}
.step .n{flex-shrink:0;width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;font-family:var(--f-mono);font-weight:600;font-size:20px;display:flex;align-items:center;justify-content:center}

/* ---------- MASTRINO ---------- */
.mast{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px 24px 18px;position:relative}
.mast-h{display:flex;align-items:center;gap:10px;justify-content:center;font-family:var(--f-disp);font-weight:600;font-size:24px;padding-bottom:8px;border-bottom:4px solid var(--ink)}
.mcols{display:grid;grid-template-columns:1fr 1fr}
.mcol{display:flex;flex-direction:column;gap:8px;padding:8px 14px 10px 0;min-height:150px}
.mcol+.mcol{border-left:4px solid var(--ink);padding:8px 0 10px 14px}
.mlab{font-family:var(--f-mono);font-size:14px;font-weight:600;letter-spacing:.08em;color:var(--mute)}
.mcol+.mcol .mlab{text-align:right}
.ment{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:18px}
.ment .amt{font-size:20px}
.mtot{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--ink);padding-top:6px;font-family:var(--f-mono);font-weight:600;font-size:20px}
.mtot span{padding-right:14px;text-align:right}
.mtot span+span{padding:0 0 0 14px}
.stampbox{position:absolute;left:50%;bottom:-16px;transform:translateX(-50%)}
.mast .mtot{margin-bottom:34px}
.stamp{display:inline-flex;flex-direction:column;align-items:center;gap:2px;border:5px double var(--ver-t);color:var(--ver-t);background:rgba(255,255,255,.9);border-radius:10px;padding:8px 18px;font-family:var(--f-disp);font-weight:800;font-size:24px;letter-spacing:.03em;white-space:nowrap}
.stamp small{font-family:var(--f-mono);font-size:15px;font-weight:600;letter-spacing:.08em}
.stamp.ink{border-color:var(--ink);color:var(--ink);font-size:38px;padding:12px 28px}
.stamp.ink small{font-size:19px}
.stamprow{display:flex;justify-content:center}

/* ---------- CALENDARIO ---------- */
.cal{align-self:flex-start;display:flex;align-items:center;gap:26px}
.cal-card{width:210px;border:3px solid var(--ink);border-radius:18px;overflow:hidden;background:var(--card);text-align:center}
.cal-card .top{background:var(--ros);color:#fff;font-family:var(--f-mono);font-weight:600;font-size:20px;letter-spacing:.12em;padding:8px}
.cal-card .big{font-family:var(--f-disp);font-weight:800;font-size:132px;line-height:1.1}
.cal .txt{font-size:24px;line-height:1.35;max-width:380px;font-weight:500}

/* ---------- FLUSSI ---------- */
.flow{position:relative}
.flow svg.trails{position:absolute;left:0;top:0;overflow:visible}
.node{position:absolute;width:220px;margin-left:-110px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.node .circ{width:100px;height:100px;border-radius:50%;background:var(--card);border:4px solid var(--ink);display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.node .lab{font-family:var(--f-mono);font-weight:600;font-size:19px;letter-spacing:.06em}
.node .sub{font-size:17px;color:var(--mute);line-height:1.25;font-weight:500}
.mover{position:absolute;left:0;top:0;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:4px solid var(--ink);background:var(--card);box-shadow:0 8px 20px rgba(27,31,42,.25);z-index:3;opacity:0}
.mover.b{border-color:var(--blu);background:var(--blu-bg)}.mover.v{border-color:var(--vio);background:var(--vio-bg)}.mover.t{border-color:var(--tea);background:var(--tea-bg)}.mover.g{border-color:var(--ver);background:var(--ver-bg)}.mover.r{border-color:var(--ros);background:var(--ros-bg)}
.mlabel{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;font-family:var(--f-mono);font-weight:600;font-size:17px;padding:5px 12px;border-radius:20px;background:var(--ink);color:#fff;z-index:2}
.mlabel.b{background:var(--blu)}.mlabel.v{background:var(--vio)}.mlabel.t{background:var(--tea-t)}.mlabel.g{background:var(--ver-t)}.mlabel.r{background:var(--ros-t)}
.mlabel-wrap{position:absolute;left:0;top:0;z-index:2}

/* ---------- INTRO / CAPITOLI / OUTRO ---------- */
.intro{background:var(--paper);padding:84px 96px;box-sizing:border-box;display:grid;grid-template-columns:1fr 640px;gap:80px}
.kick{font-family:var(--f-mono);font-size:22px;font-weight:600;letter-spacing:.14em;color:var(--mute)}
.intro h1{margin:22px 0 22px;font-family:var(--f-disp);font-weight:800;font-size:104px;line-height:.98;letter-spacing:-.025em}
.intro p.sub{margin:0;font-size:30px;line-height:1.4;color:#3E4454;max-width:760px}
.codes{display:flex;flex-direction:column;gap:18px;justify-content:center}
.code{display:flex;gap:20px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:18px 22px}
.code .sw{width:78px;height:78px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--f-mono);font-weight:600;font-size:20px;border:4px solid}
.code h4{margin:0;font-family:var(--f-disp);font-weight:600;font-size:28px}
.code p{margin:2px 0 0;font-size:19px;color:#3E4454}
.code .econ4{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.code .econ4 .amt{font-size:15px;padding:2px 8px}
.code em{font-style:normal;font-family:var(--f-mono);font-size:15px;font-weight:600;letter-spacing:.08em;color:var(--mute)}
.tacc{margin-top:46px;width:640px}
.tacc .tn{text-align:center;font-weight:600;font-size:24px;padding-bottom:8px;border-bottom:4px solid var(--ink)}
.tacc .tc{display:grid;grid-template-columns:1fr 1fr}
.tacc .tc>div{display:flex;flex-direction:column;gap:10px;padding:10px 14px 0 0;min-height:130px}
.tacc .tc>div+div{border-left:4px solid var(--ink);padding:10px 0 0 14px;align-items:flex-end}
.chap{background:var(--ink);color:#F6F3EC;padding:120px 120px;box-sizing:border-box}
.chap .no{font-family:var(--f-disp);font-weight:800;font-size:300px;line-height:.85;letter-spacing:-.04em}
.chap .no span:nth-child(1){color:var(--ver)}.chap .no span:nth-child(2){color:#6E8BFF}
.chap h3{margin:30px 0 40px;font-family:var(--f-disp);font-weight:800;font-size:96px;letter-spacing:-.02em;line-height:1}
.chap ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.chap li{font-size:30px;color:#C9CEDA;display:flex;gap:18px;align-items:baseline}
.chap li b{font-family:var(--f-mono);font-size:20px;color:#8D95A8;font-weight:600}
.stripe{position:absolute;top:-200px;bottom:-200px;width:520px;z-index:10}
.outro{background:var(--paper);padding:90px 120px;box-sizing:border-box;display:flex;flex-direction:column;gap:24px}
.outro h3{margin:0;font-family:var(--f-disp);font-weight:800;font-size:92px;letter-spacing:-.02em}
.rule{display:flex;align-items:center;gap:26px;font-size:36px;font-weight:500}
.rule .amt{font-size:30px;min-width:150px;text-align:center}
.final{margin-top:20px;align-self:flex-start;font-family:var(--f-disp);font-weight:800;font-size:56px;background:var(--ink);color:#fff;padding:18px 36px;border-radius:18px}


/* ---------- MODALITÀ PRESENTAZIONE ---------- */
.player{position:relative}
.modebar{gap:12px}
.seg2{display:inline-flex;border:1px solid #2C3346;border-radius:12px;overflow:hidden}
.seg2 button{min-height:44px;padding:0 16px;border:0;background:transparent;color:var(--chrome-mute);font:600 15px var(--f-body);cursor:pointer}
.seg2 button[aria-pressed="true"]{background:var(--chrome-fg);color:var(--ink)}
.seg2 button:focus-visible{outline:3px solid #8FA6FF;outline-offset:-3px}
.pos{font-family:var(--f-mono);font-size:14px;color:var(--chrome-mute);white-space:nowrap}
.cbtn.big{height:52px;padding:0 22px;font-size:17px}
.dots{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:#2C3346}
.dots i.on{background:var(--chrome-fg)}
.hint{font-size:14px;color:var(--chrome-mute);margin-left:auto}
.viewport.clickable{cursor:pointer}
.index{position:absolute;inset:0;z-index:40;background:rgba(10,12,18,.88);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto;border-radius:10px}
.index-box{width:100%;max-width:1100px;background:var(--chrome-2);border:1px solid #2C3346;border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:16px}
.index-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.index-h h3{margin:0;font-family:var(--f-disp);font-size:28px}
.index-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.ichap{display:flex;flex-direction:column;gap:4px;min-width:0}
.ichap button{display:flex;gap:10px;align-items:baseline;text-align:left;width:100%;min-height:40px;padding:8px 10px;border-radius:8px;border:0;background:transparent;color:var(--chrome-fg);font:500 15px/1.3 var(--f-body);cursor:pointer}
.ichap button:hover{background:#262D40}
.ichap button:focus-visible{outline:3px solid #8FA6FF}

  s.el=el;s.anims=ctx.anims;s.dur=11;s.stops=[1.5,4.0];return s;
}
function buildChapter(sec){
  const S=SECS[sec];const list=LESSONS.filter(l=>l.sec===sec);
  const s={kind:'chap',sec,cap:`Capitolo ${sec}: ${S.t.toLowerCase()}.`};
  const el=h('section','scene chap');
  const n=String(sec).padStart(2,'0');
  el.innerHTML=`<div class="no"><span>${n[0]}</span><span>${n[1]}</span></div><h3>${S.t}</h3><ul>${list.map(l=>`<li><b>${String(l.slide).padStart(2,'0')}</b>${l.title}</li>`).join('')}</ul>`;
  const ctx={t:0,anims:[]};
  ['var(--ver)','var(--blu)','var(--ros)'].forEach((c,i)=>{const st=h('div','stripe');st.style.background=c;st.style.left='0';el.append(st);A(ctx,st,i*.09,.85,'wipe')});
  A(ctx,el.querySelector('.no'),.35,.6,'left');A(ctx,el.querySelector('h3'),.55,.6,'up');
  el.querySelectorAll('li').forEach((li,i)=>A(ctx,li,.9+i*.18,.45,'left'));
  s.el=el;s.anims=ctx.anims;s.dur=Math.max(3.4,1.6+list.length*.18+1.6);s.trans=.3;return s;
}
function buildOutro(){
  const s={kind:'outro',sec:6,cap:'Ricapitolando: verde sempre in Dare, rosso sempre in Avere, i conti economici in Dare o in Avere secondo la loro natura, ognuno con il suo colore. E ogni scrittura deve quadrare.'};
  const el=h('section','scene outro');
  el.innerHTML=`<div class="kick">RICAPITOLANDO</div><h3>Il codice colore in quattro regole</h3>
   <div class="rule"><span class="amt g">VF+</span><span>Entrate, crediti che nascono, debiti che si estinguono → <b class="g">sempre in DARE</b></span></div>
   <div class="rule"><span class="amt r">VF−</span><span>Uscite, debiti che nascono, crediti che si estinguono → <b class="r">sempre in AVERE</b></span></div>
   <div class="rule"><span class="amt b">VE</span><span>Costi e rettifiche di ricavo in <b class="b">DARE</b> · Ricavi, rettifiche di costo e <b class="t">PN</b> in <b class="b">AVERE</b></span></div>
   <div class="rule"><span class="amt v">VE</span><span>Quattro colori economici: <b class="b">d’esercizio</b> · <b class="v">costi pluriennali</b> · <b class="t">patrimonio netto</b> · <b class="o">costi e ricavi sospesi</b></span></div>
   <div class="final">Totale Dare = Totale Avere</div>`;
  const ctx={t:0,anims:[]};
  A(ctx,el.querySelector('.kick'),.2,.5,'left');A(ctx,el.querySelector('h3'),.4,.6,'up');
  const r=el.querySelectorAll('.rule');A(ctx,r[0],1.3,.6,'left');A(ctx,r[1],2.3,.6,'right');A(ctx,r[2],3.3,.6,'pop');A(ctx,r[3],4.1,.6,'up');
  A(ctx,el.querySelector('.final'),5.0,.7,'pop');A(ctx,el.querySelector('.final'),5.7,.7,'flash',{rgb:RGB.g});
  s.el=el;s.anims=ctx.anims;s.dur=10.5;s.stops=[1.3,5.0];return s;
}

addScene(buildIntro());
for(let sec=1;sec<=5;sec++){addScene(buildChapter(sec));LESSONS.filter(l=>l.sec===sec).forEach(l=>addScene(buildLesson(l)))}
addScene(buildOutro());

const stage=document.getElementById('stage');
/* passi della presentazione: a ogni fermata tutto ciò che è già partito deve essere finito,
   altrimenti si sposta in avanti il resto della scena */
scenes.forEach(s=>{
  const st=(s.stops||[]).slice().sort((a,b)=>a-b);let shift=0;
  for(let k=0;k<st.length;k++){
    const t=st[k];
    const over=s.anims.filter(a=>a.t0<t-1e-6).reduce((m,a)=>Math.max(m,a.t0+a.d),0)-t;
    if(over>.001){const g=over+.05;s.anims.forEach(a=>{if(a.t0>=t-1e-6)a.t0+=g});for(let j=k;j<st.length;j++)st[j]+=g;shift+=g}
  }
  s.dur+=shift;
  const end=s.anims.reduce((m,a)=>Math.max(m,a.t0+a.d),0);s.end=end;
  const ok=st.filter(t=>t>.6&&t<end-.05);ok.push(end);
  s.stops=ok.filter((t,k)=>k===0||t-ok[k-1]>.05);
});
let acc=0;scenes.forEach(s=>{s.start=acc;acc+=s.dur;s.el.style.display='none';stage.append(s.el)});
const TOTAL=acc;

/* ================= BARRA SEZIONI, MARCATORI, CAPITOLI ================= */
const segsEl=document.getElementById('segs');const segs=[];
for(let sec=1;sec<=5;sec++){
  const sc=scenes.filter(s=>s.sec===sec);const a=sc[0].start,b=sc[sc.length-1].start+sc[sc.length-1].dur;
  const el=h('div','seg',`<span>${String(sec).padStart(2,'0')} ${SECS[sec].s.toUpperCase()}</span><i><b></b></i>`);segsEl.append(el);
  segs.push({el,a,b,bar:el.querySelector('b')});
}
const marks=document.getElementById('marks'),chipsEl=document.getElementById('chips');
const chapList=[{l:'Intro',t:0}];for(let sec=1;sec<=5;sec++){const c=scenes.find(s=>s.kind==='chap'&&s.sec===sec);chapList.push({l:String(sec).padStart(2,'0')+' '+SECS[sec].s,t:c.start})}
chapList.push({l:'Ripasso',t:scenes[scenes.length-1].start});
chapList.forEach(c=>{const m=h('i');m.style.left=(c.t/TOTAL*100)+'%';marks.append(m);const b=h('button','',c.l);b.type='button';b.addEventListener('click',()=>{seek(c.t);});chipsEl.append(b);c.btn=b});

/* ================= RENDER ================= */
const capEl=document.getElementById('caption'),capTxt=document.getElementById('captxt'),topbar=document.getElementById('topbar');
let lastScene=-1,shown=new Set();
function sceneIndexAt(T){let i=0;while(i<scenes.length-1&&T>=scenes[i+1].start)i++;return i}
function applyScene(s,lt){
  for(const a of s.anims){
    const p=clamp((lt-a.t0)/a.d,0,1);
    if(p===a.lp)continue;a.lp=p;K[a.k](a.el,p,a.o);
  }
}
function render(T){
  T=clamp(T,0,TOTAL);
  const i=sceneIndexAt(T),sc=scenes[i],lt=T-sc.start,tr=sc.trans||.55;
  const vis=new Set([i]);
  const inTrans=i>0&&lt<tr;
  if(inTrans)vis.add(i-1);
  shown.forEach(j=>{if(!vis.has(j)){scenes[j].el.style.display='none'}});
  vis.forEach(j=>{scenes[j].el.style.display=''});shown=vis;
  if(inTrans){
    const pv=scenes[i-1],e=eo(lt/tr);
    applyScene(pv,pv.dur);pv.el.style.zIndex=1;pv.el.style.opacity=1-e;pv.el.style.transform=`translateX(${-e*110}px)`;
  }
  const e=i>0?eo(Math.min(1,lt/tr)):1;
  sc.el.style.zIndex=2;sc.el.style.opacity=sc.kind==='chap'?1:e;sc.el.style.transform=sc.kind==='chap'?'none':`translateX(${(1-e)*110}px)`;
  applyScene(sc,lt);
  if(i!==lastScene){capTxt.textContent=sc.cap;lastScene=i;
    topbar.style.opacity=sc.kind==='lesson'?1:0;
    segs.forEach((g,k)=>g.el.classList.toggle('on',sc.sec===k+1));
    let ci=0;chapList.forEach((c,k)=>{if(T>=c.t-0.001)ci=k});chapList.forEach((c,k)=>c.btn.classList.toggle('on',k===ci));
  }
  capEl.style.opacity=Math.min(1,Math.max(0,(lt-.15)/.4));
  segs.forEach(g=>{g.bar.style.width=(clamp((T-g.a)/(g.b-g.a),0,1)*100)+'%'});
}

/* ================= LETTORE ================= */
let T=0,playing=false,speed=1,lastTs=0,lessonMode=false,target=null,mode='pres';
const $=id=>document.getElementById(id);
const seekEl=$('seek'),timeEl=$('time'),posEl=$('pos'),dotsEl=$('dots');
seekEl.max=TOTAL;
const mmss=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
/* passo corrente: quante fermate della scena sono già state raggiunte */
function where(){const i=sceneIndexAt(T),s=scenes[i],lt=T-s.start;let k=0;s.stops.forEach(t=>{if(lt>=t-.02)k++});return{i,s,lt,k}}
function sceneName(s){return s.kind==='lesson'?`Slide ${s.slide} di 25`:s.kind==='chap'?`Capitolo ${s.sec}`:s.kind==='intro'?'Copertina':'Ripasso finale'}
function ui(){
  seekEl.value=T;timeEl.textContent=mmss(T)+' / '+mmss(TOTAL);
  $('lPlay').textContent=playing&&mode==='vid'?'Pausa':'Riproduci';
  $('bPlay').setAttribute('aria-label',playing&&mode==='vid'?'Pausa':'Riproduci');
  $('icoPlay').innerHTML=playing&&mode==='vid'?'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>':'<path d="M7 4v16l13-8z"/>';
  const w=where();
  posEl.textContent=mode==='pres'?`${sceneName(w.s)} · passo ${Math.max(1,w.k)} di ${w.s.stops.length}`:sceneName(w.s);
  if(dotsEl.childElementCount!==w.s.stops.length||dotsEl.dataset.i!==String(w.i)){dotsEl.innerHTML=w.s.stops.map(()=>'<i></i>').join('');dotsEl.dataset.i=w.i}
  [...dotsEl.children].forEach((d,k)=>d.classList.toggle('on',k<w.k));
  const last=w.i===scenes.length-1&&w.k>=w.s.stops.length;
  $('pNext').disabled=last;$('pPrev').disabled=w.i===0&&w.k<=1;
}
function seek(t){target=null;playing=false;T=clamp(t,0,TOTAL);render(T);ui()}
function play(){if(T>=TOTAL-.01)T=0;playing=true;lastTs=performance.now();ui();requestAnimationFrame(loop)}
function pause(){playing=false;target=null;ui()}
function animateTo(t){target=t;if(!playing){playing=true;lastTs=performance.now();requestAnimationFrame(loop)}ui()}
function loop(ts){
  if(!playing)return;
  const dt=Math.min(.1,(ts-lastTs)/1000);lastTs=ts;
  const before=sceneIndexAt(T);let nt=T+dt*speed;
  if(target!=null&&nt>=target){T=target;target=null;playing=false;render(T);ui();return}
  if(mode==='vid'&&lessonMode){const nxt=scenes[before+1];if(nxt&&nt>=nxt.start){T=nxt.start-.001;render(T);pause();return}}
  T=nt;
  if(T>=TOTAL){T=TOTAL;render(T);pause();return}
  render(T);ui();requestAnimationFrame(loop);
}
/* ---- presentazione: avanti / indietro per passi ---- */
function next(){
  if(target!=null){const t=target;seek(t);return}          // salta l'animazione in corso
  const w=where();
  const nx=w.s.stops.find(t=>t>w.lt+.02);
  if(nx!=null){animateTo(w.s.start+nx);return}
  if(w.i<scenes.length-1){const s=scenes[w.i+1];T=s.start;render(T);animateTo(s.start+s.stops[0])}
}
function prev(){
  const w=where();playing=false;target=null;
  const pv=w.s.stops.filter(t=>t<w.lt-.02);
  if(pv.length){seek(w.s.start+pv[pv.length-1]);return}
  if(w.i>0){const s=scenes[w.i-1];seek(s.start+s.stops[s.stops.length-1])}
}
function goScene(i,full){const s=scenes[i];seek(s.start+(full?s.stops[s.stops.length-1]:s.stops[0]))}
function sceneJump(dir){const i=sceneIndexAt(T);const lt=T-scenes[i].start;
  if(dir<0)seek(lt>1.5?scenes[i].start:scenes[Math.max(0,i-1)].start);
  else seek(scenes[Math.min(scenes.length-1,i+1)].start)}
function setMode(m){
  mode=m;pause();
  $('mPres').setAttribute('aria-pressed',m==='pres');$('mVid').setAttribute('aria-pressed',m==='vid');
  $('presCtl').hidden=m!=='pres';$('vidCtl').hidden=m!=='vid';
  vp.classList.toggle('clickable',m==='pres');
  if(m==='pres'){const w=where();const st=w.s.stops.filter(t=>t<=w.lt+.02);seek(w.s.start+(st.length?st[st.length-1]:w.s.stops[0]))}
  ui();
}
const vp=$('viewport'),player=$('player');
$('mPres').addEventListener('click',()=>setMode('pres'));
$('mVid').addEventListener('click',()=>setMode('vid'));
$('pNext').addEventListener('click',next);
$('pPrev').addEventListener('click',prev);
/* clic sulla slide: avanti; clic sul quinto sinistro: indietro (comodo sulla LIM) */
vp.addEventListener('click',e=>{if(mode!=='pres')return;const r=vp.getBoundingClientRect();(e.clientX-r.left<r.width*.2)?prev():next()});
$('bPlay').addEventListener('click',()=>playing?pause():play());
$('bPrev').addEventListener('click',()=>sceneJump(-1));
$('bNext').addEventListener('click',()=>sceneJump(1));
seekEl.addEventListener('input',()=>seek(parseFloat(seekEl.value)));
$('speed').addEventListener('change',e=>{speed=parseFloat(e.target.value)});
$('cCap').addEventListener('change',e=>stage.classList.toggle('nocap',!e.target.checked));
$('cLesson').addEventListener('change',e=>{lessonMode=e.target.checked});
$('bFull').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await player.requestFullscreen()}catch(err){}});
/* capitoli: in presentazione si apre la scheda del capitolo */
chapList.forEach(c=>{c.btn.onclick=()=>{const i=scenes.findIndex(s=>Math.abs(s.start-c.t)<1e-6);mode==='pres'?goScene(i,true):seek(c.t)}});
/* ---- indice ---- */
const idx=$('index'),grid=$('indexGrid');
(function buildIndex(){
  const groups=[{t:'Copertina',items:[0]}];
  for(let sec=1;sec<=5;sec++){const ids=[];scenes.forEach((s,i)=>{if(s.sec===sec)ids.push(i)});groups.push({sec,items:ids})}
  groups.push({t:'Ripasso finale',items:[scenes.length-1]});
  groups.forEach(g=>{
    const col=h('div','ichap');
    g.items.forEach(i=>{const s=scenes[i];
      const label=s.kind==='lesson'?`<b>${String(s.slide).padStart(2,'0')}</b><span>${s.title}</span>`:s.kind==='chap'?`<span>${String(s.sec).padStart(2,'0')} · ${SECS[s.sec].t}</span>`:`<span>${g.t}</span>`;
      const b=h('button',s.kind==='lesson'?'':'cap',label);b.type='button';b.dataset.i=i;
      b.addEventListener('click',()=>{closeIndex();mode==='pres'?goScene(i,s.kind!=='lesson'):seek(s.start)});
      col.append(b)});
    grid.append(col)});
})();
function openIndex(){const i=sceneIndexAt(T);grid.querySelectorAll('button').forEach(b=>b.classList.toggle('here',+b.dataset.i===i));idx.hidden=false;(grid.querySelector('.here')||$('iClose')).focus()}
function closeIndex(){idx.hidden=true;$('bIndex').focus()}
$('bIndex').addEventListener('click',openIndex);$('iClose').addEventListener('click',closeIndex);
idx.addEventListener('click',e=>{if(e.target===idx)closeIndex()});
/* ---- tastiera e telecomandi (inviano PagGiù/PagSu o frecce) ---- */
document.addEventListener('keydown',e=>{
  if(!idx.hidden){if(e.key==='Escape'){e.preventDefault();closeIndex()}return}
  const tg=e.target;if(tg.tagName==='SELECT'||tg.type==='range'||tg.type==='checkbox')return;
  const onBtn=tg.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter');
  if(e.key==='i'||e.key==='I'){e.preventDefault();openIndex();return}
  if(e.key==='f'||e.key==='F'){e.preventDefault();$('bFull').click();return}
  if(mode==='pres'){
    if(onBtn)return;
    if(['ArrowRight','ArrowDown','PageDown',' ','Enter','n'].includes(e.key)){e.preventDefault();next()}
    else if(['ArrowLeft','ArrowUp','PageUp','Backspace','p'].includes(e.key)){e.preventDefault();prev()}
    else if(e.key==='Home'){e.preventDefault();goScene(0,false)}
    else if(e.key==='End'){e.preventDefault();goScene(scenes.length-1,true)}
  }else{
    if(e.key===' '&&!onBtn){e.preventDefault();playing?pause():play()}
    else if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();sceneJump(1)}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();sceneJump(-1)}
  }
});

/* scala del palco */
function fit(){const w=vp.clientWidth,hh=vp.clientHeight;const s=Math.min(w/1920,hh/1080);stage.style.transform=`translate(${(w-1920*s)/2}px,${(hh-1080*s)/2}px) scale(${s})`}
new ResizeObserver(fit).observe(vp);fit();

/* stato iniziale: copertina completa, oppure la sezione indicata nel link (#cap1…#cap5, #slide7, #ripasso) */
seek(5.2);goScene(0,true);setMode('pres');
(function fromHash(){
  const hsh=(location.hash||'').slice(1).toLowerCase();let i=-1;
  let m;
  if((m=hsh.match(/^cap([1-5])$/)))i=scenes.findIndex(s=>s.kind==='chap'&&s.sec===+m[1]);
  else if((m=hsh.match(/^slide(\d{1,2})$/)))i=scenes.findIndex(s=>s.kind==='lesson'&&s.slide===+m[1]);
  else if(hsh==='ripasso')i=scenes.length-1;
  if(i>=0)goScene(i,scenes[i].kind!=='lesson');
})();
window.__lesson={seek,next,prev,TOTAL,state:()=>{const w=where();return{scena:w.i,passo:w.k,passi:w.s.stops.length,T:+T.toFixed(2)}},scenes:scenes.map(s=>({start:s.start,dur:s.dur,kind:s.kind,title:s.title||s.kind,cap:s.cap,stops:s.stops}))};
})();
</script>
